org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# 개발 서버 주소. 에뮬레이터에서 호스트 PC는 10.0.2.2. 실기기는 PC의 LAN IP로 바꾼다.
# 빌드할 때 덮어쓰기: ./gradlew assembleDebug -Ppleos.apiBaseUrl=http://192.168.0.10:8090/
pleos.apiBaseUrl=http://10.0.2.2:8090/

# 릴리스(제출 APK) 서버 주소. HTTPS 서버를 배포하면 채운다. 비우면 위 개발 주소로 빌드된다.
# pleos.releaseApiBaseUrl=https://api.example.com/

# 제출 APK 이름: 팀명_앱이름_release.apk (./gradlew :vehicle-app:exportReleaseApk)
pleos.teamName=귤까먹는헬창
pleos.appName=쉼표
